# Owner: openlogi-desktop's ui::components::icon_button — an icon-only button
# takes its accessible name (and the matching tooltip) as a required argument.
id: gui-icon-button-label-owner
language: rust
severity: error
message: An icon-only Button has no accessible name; build it with ui::components::icon_button(id, icon, label), or give it a visible .label().
note: |
  gpui-component's Button is named by `.label()`; `.icon()` alone gives a
  screen reader a nameless "button" (the device-card menu, carousel arrows
  and DPI preset remove buttons all were). See docs/specs/gui-accessibility.md.
files:
  - crates/openlogi-desktop/src/**/*.rs
ignores:
  - crates/openlogi-desktop/src/ui/components.rs
  - "**/tests.rs"
  - "**/tests/**"
utils:
  button-rooted:
    any:
      - pattern: Button::new($$$)
      - kind: call_expression
        has:
          field: function
          kind: field_expression
          has:
            field: value
            matches: button-rooted
  chain-calls-icon:
    kind: call_expression
    has:
      field: function
      kind: field_expression
      any:
        - has:
            field: field
            regex: ^icon$
        - has:
            field: value
            matches: chain-calls-icon
  chain-calls-label:
    kind: call_expression
    has:
      field: function
      kind: field_expression
      any:
        - has:
            field: field
            regex: ^(label|accessibility_label)$
        - has:
            field: value
            matches: chain-calls-label
rule:
  # Inline test harnesses may use raw elements.
  not:
    inside:
      kind: mod_item
      stopBy: end
      has:
        field: name
        regex: ^tests$
  # The whole chain: a Button::new chain that is not itself the receiver of a
  # longer one.
  all:
    - matches: button-rooted
    - matches: chain-calls-icon
    - not:
        matches: chain-calls-label
    - not:
        inside:
          kind: field_expression
          field: value
